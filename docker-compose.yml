services:
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "18080:5000"
    environment:
      APP_ENV: dev
      ALLOWED_PROXY_HOSTS: internal-admin
      ALLOWED_PROXY_URLS: http://internal-admin:5001/health
    depends_on:
      - internal-admin
    networks:
      - gateway-ring

  internal-admin:
    build:
      context: .
      dockerfile: internal-admin/Dockerfile
    container_name: internal-admin
    environment:
      APP_ENV: dev
      SERVICE_ID: internal-admin
      TOKEN_ISSUER: token-service
      HTTP_PORT: 5001
      HTTPS_PORT: 5443
      TOKEN_SIGNING_PUBLIC_KEY_PATH: /keys/token-service-public.pem
      TLS_SERVER_CERT_PATH: /tls/internal-admin-server-cert.pem
      TLS_SERVER_KEY_PATH: /tls/internal-admin-server-key.pem
      TLS_CA_CERT_PATH: /tls/ca-cert.pem
      ADMIN_EXPORTER_PUBLIC_KEY_PATH: /keys/admin-exporter-public.pem
      ADMIN_OBSERVER_PUBLIC_KEY_PATH: /keys/admin-observer-public.pem
    expose:
      - "5001"
      - "5443"
    networks:
      - gateway-ring
      - service-ring

  redirector:
    build: ./redirector
    container_name: redirector
    expose:
      - "5002"
    networks:
      - service-ring

  token-service:
    build:
      context: .
      dockerfile: token-service/Dockerfile
    container_name: token-service
    environment:
      APP_ENV: dev
      TOKEN_ISSUER: token-service
      HTTP_PORT: 5003
      HTTPS_PORT: 5443
      TOKEN_SIGNING_PRIVATE_KEY_PATH: /keys/token-service-private.pem
      TLS_SERVER_CERT_PATH: /tls/token-service-server-cert.pem
      TLS_SERVER_KEY_PATH: /tls/token-service-server-key.pem
      TLS_CA_CERT_PATH: /tls/ca-cert.pem
      ADMIN_EXPORTER_PUBLIC_KEY_PATH: /keys/admin-exporter-public.pem
      ADMIN_OBSERVER_PUBLIC_KEY_PATH: /keys/admin-observer-public.pem
    expose:
      - "5003"
      - "5443"
    networks:
      - service-ring

  ops-client:
    build:
      context: .
      dockerfile: ops-client/Dockerfile
    profiles:
      - verify
    depends_on:
      - internal-admin
      - token-service
    networks:
      - service-ring

networks:
  gateway-ring:
    driver: bridge
  service-ring:
    driver: bridge
    internal: true
