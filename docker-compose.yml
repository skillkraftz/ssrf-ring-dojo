services:
  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "18080:5000"
    environment:
      APP_ENV: dev
      ALLOWED_PROXY_HOSTS: internal-admin
      ALLOWED_PROXY_URLS: http://internal-admin:5001/health
    depends_on:
      - internal-admin
      - redirector
      - token-service
    networks:
      - ring

  internal-admin:
    build:
      context: .
      dockerfile: internal-admin/Dockerfile
    container_name: internal-admin
    environment:
      APP_ENV: dev
      SERVICE_ID: internal-admin
      TOKEN_ISSUER: token-service
      ACCESS_TOKEN_SIGNING_SECRET: dojo-access-token-signing-secret
    expose:
      - "5001"
    networks:
      - ring

  redirector:
    build: ./redirector
    container_name: redirector
    expose:
      - "5002"
    networks:
      - ring

  token-service:
    build:
      context: .
      dockerfile: token-service/Dockerfile
    container_name: token-service
    environment:
      APP_ENV: dev
      TOKEN_ISSUER: token-service
      ACCESS_TOKEN_SIGNING_SECRET: dojo-access-token-signing-secret
      INTERNAL_ADMIN_CLIENT_ID: internal-admin
      INTERNAL_ADMIN_CLIENT_SECRET: dojo-internal-admin-client-secret
    expose:
      - "5003"
    networks:
      - ring

networks:
  ring:
    driver: bridge
